<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎒 Smart Prep Alarm</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#08080a;
  --panel:#141416;
  --panel-2:#1b1b1f;
  --border:rgba(255,255,255,.08);
  --text:#f5f5f6;
  --text-dim:#a6a6ad;
  --muted:#6f6f76;
  --lime:#c6f135;
  --lime-strong:#d9ff53;
  --orange:#ff9640;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#000;color:var(--text);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',system-ui,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* top light-spectrum ribbon, echoing the reference hero */
.spectrum{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:120%;max-width:1600px;height:120px;
  background:linear-gradient(90deg,var(--lime),#fff 42%,var(--orange) 68%,var(--lime) 100%);
  border-radius:0 0 50% 50%/0 0 100% 100%;
  filter:blur(30px);opacity:.55;pointer-events:none;
}
.spectrum::after{
  content:'';position:absolute;inset:-20px -10% -260px;
  background:inherit;filter:blur(90px);opacity:.5;z-index:-1;
}

.hero{
  position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:170px 24px 90px;text-align:center;overflow:hidden;
}

.glow{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  width:640px;height:520px;
  background:
    radial-gradient(closest-side, rgba(198,241,53,.20), transparent 70%),
    radial-gradient(closest-side at 65% 40%, rgba(255,150,64,.18), transparent 70%);
  filter:blur(10px);pointer-events:none;
}

.tile{
  position:relative;z-index:1;
  width:168px;height:168px;border-radius:42px;
  display:flex;align-items:center;justify-content:center;
  font-size:76px;
  background:
    radial-gradient(120% 140% at 30% 20%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(145deg,#1c1c1f,#0d0d0f 60%,#050506);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 30px 70px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 90px rgba(198,241,53,.12);
  margin-bottom:26px;
}

.eyebrow{
  position:relative;z-index:1;
  margin:0 0 18px;color:var(--text-dim);font-size:15px;font-weight:600;letter-spacing:.01em;
}

.headline{
  position:relative;z-index:1;
  margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.18;
  font-size:clamp(30px,5.4vw,52px);
}
.headline span{display:block}
.headline .l1{
  background:linear-gradient(180deg,#f2f2f4,#9c9ca3);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.headline .l2{
  background:linear-gradient(180deg,var(--lime-strong),var(--lime) 55%,#7fae12);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.sub{
  position:relative;z-index:1;
  max-width:620px;margin:26px 0 0;color:var(--text-dim);
  font-size:16px;line-height:1.75;
}

.badge{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:10px;margin-top:34px;
  padding:9px 20px 9px 10px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);font-size:13.5px;font-weight:600;
}
.badge-icon{
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--lime),var(--orange));font-size:14px;
}

.cta{
  position:relative;z-index:1;
  margin-top:36px;display:inline-flex;align-items:center;gap:10px;
  padding:16px 34px;border-radius:999px;
  background:var(--lime);color:#0a0a0a;font-weight:800;font-size:16px;letter-spacing:-.01em;
  text-decoration:none;transition:.15s;
  box-shadow:0 20px 50px rgba(198,241,53,.18);
}
.cta:hover{background:var(--lime-strong);transform:translateY(-2px);box-shadow:0 26px 60px rgba(198,241,53,.24)}
.cta:active{transform:translateY(0)}
.cta .arrow{transition:.15s}
.cta:hover .arrow{transform:translateX(3px)}

.foot-note{
  position:relative;z-index:1;margin-top:18px;color:var(--muted);font-size:12.5px;
}

.transition-overlay{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(circle at 50% 50%, rgba(198,241,53,.15), #000 70%);
  opacity:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease;
}
.transition-overlay.active{opacity:1;pointer-events:all}
.transition-badge{
  width:86px;height:86px;border-radius:26px;
  display:flex;align-items:center;justify-content:center;font-size:40px;
  background:linear-gradient(145deg,#1c1c1f,#0d0d0f 60%,#050506);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 60px rgba(198,241,53,.25), inset 0 1px 0 rgba(255,255,255,.12);
  transform:scale(.7);opacity:0;
  transition:transform .45s cubic-bezier(.22,1,.36,1), opacity .45s ease;
}
.transition-overlay.active .transition-badge{transform:scale(1);opacity:1}

:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media(max-width:520px){
  .hero{padding:140px 20px 70px}
  .tile{width:132px;height:132px;border-radius:34px;font-size:58px}
  .sub{font-size:14.5px}
}
</style>
</head>
<body>
<div class="hero">
  <div class="spectrum"></div>
  <div class="glow"></div>

  <div class="tile">🎒</div>
  <p class="eyebrow">Smart Prep Alarm</p>

  <h1 class="headline">
    <span class="l1">놓치지 않는 준비물,</span>
    <span class="l2">놓치지 않는 알람.</span>
  </h1>

  <p class="sub">
    채팅 캡처 한 장이면 충분합니다. 사진 속 날짜와 준비물을 자동으로 읽어내고,
    정해진 시간이 되면 브라우저 알림으로 알려드립니다.
    분석부터 알람까지 전부 이 브라우저 안에서 처리되어, 별도 로그인이나 앱 설치가 필요 없습니다.
  </p>

  <div class="badge">
    <span class="badge-icon">🔔</span>
    OCR 자동 인식 &amp; 브라우저 알람 탑재
  </div>

  <a class="cta" href="smart-prep-alarm.html">
    Smart Prep Alarm 시작하기 <span class="arrow">→</span>
  </a>

  <p class="foot-note">Chrome / Edge 최신 브라우저에서 알림 권한을 허용하면 가장 잘 작동합니다.</p>
</div>

<div class="transition-overlay" id="pageTransition">
  <div class="transition-badge">🎒</div>
</div>

<script>
(function(){
  var cta = document.querySelector('.cta');
  var overlay = document.getElementById('pageTransition');
  if(!cta || !overlay) return;

  cta.addEventListener('click', function(e){
    e.preventDefault();
    var href = cta.getAttribute('href');
    overlay.classList.add('active');
    setTimeout(function(){ window.location.href = href; }, 480);
  });

  // 뒤로가기(bfcache)로 이 페이지에 돌아왔을 때 오버레이 초기화
  window.addEventListener('pageshow', function(evt){
    if (evt.persisted) overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
